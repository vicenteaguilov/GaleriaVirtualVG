<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galería de videojuegos XR</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>

      <!-- Declaración de assets-->
      <a-assets>
        <a-asset-item id="silla" src="activos/silla.glb"> </a-asset-item>
        <a-asset-item id="tv" src="activos/tv.glb"> </a-asset-item>
        <a-asset-item id="doorway" src="activos/doorway.glb"> </a-asset-item>
        <a-asset-item id="skate" src="activos/skate.glb"> </a-asset-item>
      </a-assets>
      <!---->

      <!-- Mundo base-->
      <a-entity camera="fov: 60" look-controls wasd-controls position="0 1 1"></a-entity>
      <a-plane rotation="-90 0 0" width="8" height="8">
      </a-plane> 

      <a-sky color="#222D62">
      </a-sky>
      <!---->

      <!-- Implementación de assets -->
      <a-entity gltf-model="#tv"
        position="0 0 -2"
        scale="2 2 2"
        rotation="0 180 0">
      </a-entity>

      <a-entity gltf-model="#skate"
        position="1 0 -2"
        scale="1 1 1"> 
      </a-entity>

      <a-entity gltf-model="#doorway"
        position="0 0 -1.5"
        scale="1.2 1 1.5"
        rotation="0 90 0"> 
      </a-entity>
      <!---->

    </a-scene>
  </body>
</html>
