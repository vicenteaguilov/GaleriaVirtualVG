<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galería de videojuegos XR</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@5.x.x/dist/aframe-event-set-component.min.js"></script>
  </head>
  <body>
    <a-scene>

      <!-- Declaración de assets-->
      <a-assets>
        <a-asset-item id="silla" src="activos/silla.glb"> </a-asset-item>
        <a-asset-item id="tv" src="activos/tv.glb"> </a-asset-item>
        <a-asset-item id="doorway" src="activos/doorway.glb"> </a-asset-item>
        <a-asset-item id="skate" src="activos/skate.glb"> </a-asset-item>
        <a-asset-item id="cover" src="activos/crackpots.jpg"></a-asset-item>
        <video id="crackpots_video" src="activos/crackpots_video_720p.mp4" autoplay loop="true"> </video>
        <audio id="crackpots_audio" src="activos/crackpots_audio.mp3"></audio>
        <audio id="sfx" src="activos/paw.mp3" preload="auto"></audio>
        <audio id="sfx2" src="activos/paw_3.mp3" preload="auto"></audio>
        <audio id="sfx3" src="activos/paw_full.mp3" preload="auto"></audio>
        <audio id="sfx4" src="activos/paw_fullfull.mp3" preload="auto"></audio>
      </a-assets>
      <!---->

      <!-- Mundo base-->
      <a-entity camera="fov: 60"
        look-controls
        wasd-controls
        position="0 1 2">
      </a-entity>

      <a-entity raycaster="objects: .interactuable" cursor="rayOrigin: mouse">
      </a-entity>

      <a-plane rotation="-90 0 0" width="20" height="20"
        animation__click="property: rotation; from: -90 0 0; to: 270 360 360; dur: 600; startEvents: click"
        sound="src: #sfx4; on: click">
      </a-plane> 

      <a-sky color="#222D62">
      </a-sky>
      <!---->

      <!-- Implementación de assets -->
      <a-entity gltf-model="#tv"
        class="interactuable"
        position="0 0 -2"
        scale="2 2 2"
        rotation="0 180 0"
        animation__enter="property: scale; to: 2.2 2.2 2.2; dur: 100; startEvents: mouseenter"
        animation__leave="property: scale; to: 2 2 2; dur: 100; startEvents: mouseleave"
        sound="src: #crackpots_audio; autoplay: true; refDistance: 2; rolloffFactor: 200; maxDistance: 2; volume: 0.2"
        event-set__enter="_event: mouseenter; _target: #texto; visible: true"
        event-set__enter2="_event: mouseenter; _target: #image; visible: true"
        event-set__leave="_event: mouseleave; _target: #texto; visible: false"
        event-set__leave2="_event: mouseleave; _target: #image; visible: false">
        <a-video src="#crackpots_video"
          position="0 0.262 -0.022"
          scale="0.672 0.370 1">
        </a-video>
        <a-text id="texto"
          value="A spellslinging dueling game for up to 4 players.\nChoose among seven cracked mages and use their unique abilities to shoot down your opponent's magical flask while defending yours!\nDestroy your friends (and loved ones) in local or online modes!"
          baseline="bottom"
          align="left"
          rotation="0 180 0"
          width="1.2"
          position="-0.4 0.54 0"
          visible="false">
        </a-text>
        <a-image id="image"
          class="not_interactuable"
          src="#cover"
          visible="false"
          position="0 0.696 -0.01"
          scale="0.648 0.3645 1">
        </a-image>
      </a-entity>

      <a-entity gltf-model="#doorway"
        position="0 0 -0.3"
        scale="1.2 1 1.5"
        rotation="0 90 0"
        animation__click="property: rotation; from: 0 90 0; to: 360 -270 360; dur: 300; startEvents: click"
        sound="src: #sfx3; on: click"> 
      </a-entity>
      <!---->

    </a-scene>
  </body>
</html>
